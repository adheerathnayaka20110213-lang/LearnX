<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learnx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#0B1020;--card:#151B33;--card2:#1B2342;--line:#26305A;--ink:#E6EAF7;--mute:#A5B0D0;--cy:#22D3EE;--ok:#34D399;--bad:#F87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px/1.5 'DM Sans',sans-serif;background:radial-gradient(900px 420px at 85% -8%,rgba(34,211,238,.13),transparent),radial-gradient(700px 360px at -10% 8%,rgba(167,139,250,.11),transparent),var(--bg);background-attachment:fixed;min-height:100vh}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-.01em}
button{font-family:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:16px 24px;border-bottom:1px solid var(--line);background:rgba(11,16,32,.82);backdrop-filter:blur(12px)}
header .dot{width:12px;height:12px;border-radius:50%;background:var(--cy);box-shadow:0 0 14px var(--cy);animation:pulse 2.4s ease-in-out infinite}
header b{font:700 22px 'Space Grotesk',sans-serif}
main{max-width:960px;margin:0 auto;padding:36px 24px 72px;display:flex;flex-direction:column;gap:24px}
.mute{color:var(--mute)}
.label{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:15px}
.crumbs button{background:none;border:0;color:var(--mute);cursor:pointer;padding:6px 2px;min-height:36px;font-size:15px}
.crumbs button:hover{color:var(--cy)}
.crumbs i{color:var(--line);font-style:normal}
.crumbs .cur{color:var(--ink);font-weight:600}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:56px 32px;background:linear-gradient(135deg,#151B33,#10162B)}
.hero h1{font-size:52px;line-height:1.05;max-width:520px;position:relative}
.hero p{margin:14px 0 0;max-width:440px;font-size:19px;color:var(--mute);position:relative}
.hero .tag{position:relative;display:inline-block;margin-bottom:14px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cy)}
.cy{color:var(--cy)}
.orb{position:absolute;border-radius:50%;filter:blur(34px);opacity:.55;animation:float 9s ease-in-out infinite}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:18px;min-height:96px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left;text-decoration:none;transition:transform .2s,border-color .2s,box-shadow .2s,background .2s}
.tile:hover{transform:translateY(-5px);border-color:var(--c);background:var(--card2);box-shadow:0 14px 30px color-mix(in srgb,var(--c) 22%,transparent)}
.tile:active{transform:scale(.98)}
.tile small{font-size:13px;color:var(--mute)}
.tile b{font:700 36px/1.1 'Space Grotesk',sans-serif;color:var(--c)}
.tile.sub{flex-direction:row;align-items:center;gap:14px;min-height:76px}
.tile.sub .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:700 18px 'Space Grotesk',sans-serif;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.tile.sub span.n{font:600 19px 'DM Sans',sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left;font-size:18px;font-weight:600;transition:transform .2s,border-color .2s,background .2s}
.row:hover{transform:translateX(4px);border-color:var(--cy);background:var(--card2)}
.row .num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;color:var(--cy);background:rgba(34,211,238,.12)}
.row svg{margin-left:auto;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:12px 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,border-color .2s}
.btn:hover{transform:translateY(-3px);border-color:var(--cy)}
.btn.pri{background:var(--cy);border-color:var(--cy);color:#0B1020;align-self:flex-start}
.btn.pri:hover{box-shadow:0 10px 26px rgba(34,211,238,.35)}
.tabs{display:flex;flex-wrap:wrap;gap:10px}
.tabs .btn.on{background:rgba(34,211,238,.14);border-color:var(--cy);color:var(--cy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.q{display:flex;flex-direction:column;gap:8px}
.q label{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);cursor:pointer;transition:border-color .15s,background .15s}
.q label:hover{border-color:var(--mute)}
.q label:has(input:checked){border-color:var(--cy);background:rgba(34,211,238,.1)}
.q label.ok{border-color:var(--ok);background:rgba(52,211,153,.12)}
.q label.bad{border-color:var(--bad);background:rgba(248,113,113,.12)}
.q input{accent-color:var(--cy);width:18px;height:18px}
#result{font:700 20px 'Space Grotesk',sans-serif}
.signin{margin-left:auto;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 16px 'DM Sans',sans-serif;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.signin:hover{border-color:var(--cy);background:var(--card2);transform:translateY(-2px)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--cy);color:#0B1020;font:700 14px 'Space Grotesk',sans-serif}
.ov{display:none;position:fixed;inset:0;z-index:20;padding:20px;background:rgba(5,8,18,.72);backdrop-filter:blur(6px);place-items:center}
.ov.show{display:grid;animation:fade .2s ease}
.dlg{position:relative;width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 26px;display:flex;flex-direction:column;gap:14px;animation:pop .3s ease both}
.dlg label{font-size:14px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.dlg input{min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:17px 'DM Sans',sans-serif}
.dlg input:focus{outline:2px solid var(--cy);outline-offset:1px}
.dlg .x{position:absolute;top:10px;right:10px;width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--mute);font-size:24px;cursor:pointer}
.dlg .x:hover{color:var(--ink);background:var(--card2)}
.dlg .btn{justify-content:center}
.err{color:var(--bad);font-size:14px;min-height:18px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
main>*,.grid>*,.list>*{animation:rise .5s ease backwards}
main>*:nth-child(2){animation-delay:.07s}main>*:nth-child(3){animation-delay:.14s}main>*:nth-child(4){animation-delay:.21s}main>*:nth-child(5){animation-delay:.28s}
.grid>*:nth-child(1),.list>*:nth-child(1){animation-delay:.05s}.grid>*:nth-child(2),.list>*:nth-child(2){animation-delay:.1s}.grid>*:nth-child(3),.list>*:nth-child(3){animation-delay:.15s}.grid>*:nth-child(4),.list>*:nth-child(4){animation-delay:.2s}.grid>*:nth-child(5),.list>*:nth-child(5){animation-delay:.25s}.grid>*:nth-child(6),.list>*:nth-child(6){animation-delay:.3s}.grid>*:nth-child(7){animation-delay:.35s}
.pop{animation:pop .45s ease both}
@media (max-width:560px){.hero{padding:40px 22px}.hero h1{font-size:40px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><span class="dot"></span><b>Learnx</b><button class="signin" id="auth" type="button">Sign in</button></header>
<main id="app"></main>
<div class="ov" id="modal"></div>
<script>
/* ===== EDIT THIS DATA ===== */
var GRADES=[6,7,8,9,10,11];
var SUBJECTS=["Sinhala","ICT","Science","English","Buddhism","History","Maths"];
/* Textbook links: key is "grade|subject" */
var TEXTBOOKS={

"6|Maths":"https://govdoc.lk/view?id=3258&fid=61fa0af1e6292",
"6|Science":"https://govdoc.lk/view?id=3262&fid=61fa0bb5ea7d0",

"7|Science":"https://govdoc.lk/view?id=3296&fid=61fa15ea3def1",
"7|ICT":"https://govdoc.lk/view?id=3282&fid=61fa10dd94619",
"7|Buddhism":"https://govdoc.lk/view?id=3267&fid=61fa0c6f374d5",

"8|Maths":"https://govdoc.lk/grade-8-mathematics-text-book",
"8|History":"https://govdoc.lk/grade-8-history-text-book",
"8|English":"https://govdoc.lk/grade-8-english-text-book",
"8|Buddhism":"https://govdoc.lk/grade-8-buddhism-text-book",
"8|Science":"https://govdoc.lk/grade-8-science-text-book",
"9|Sinhala":"https://govdoc.lk/grade-9-sinhala-text-book",
"9|ICT":"https://govdoc.lk/grade-9-information-and-communication-technology-ict-text-book",
"9|Maths":"https://govdoc.lk/grade-9-mathematics-text-book",

"9|English":"https://govdoc.lk/grade-9-english-text-book",

"9|Science":"https://govdoc.lk/grade-9-science-text-book",
"10|Sinhala":"https://govdoc.lk/grade-10-sinhala-text-book",
"10|ICT":"https://govdoc.lk/grade-10-information-and-communication-technology-ict-text-book",
"10|Maths":"https://govdoc.lk/grade-10-mathematics-text-book",
"10|History":"https://govdoc.lk/grade-10-history-text-book",
"10|English":"https://govdoc.lk/grade-10-english-text-book",
"10|Buddhism":"https://govdoc.lk/grade-10-buddhism-text-book",
"10|Science":"https://govdoc.lk/grade-10-science-text-book",
"11|Sinhala":"https://govdoc.lk/grade-11-sinhala-text-book",
"11|ICT":"https://govdoc.lk/grade-11-information-and-communication-technology-ict-text-book",
"11|Maths":"https://govdoc.lk/grade-11-mathematics-text-book",
"11|History":"https://govdoc.lk/grade-11-history-text-book",
"11|English":"https://govdoc.lk/grade-11-english-text-book",
"11|Buddhism":"https://govdoc.lk/grade-11-buddhism-text-book",
"11|Science":"https://govdoc.lk/grade-11-science-text-book"
};
/* Lessons: key "grade|subject". video = DP Education link ("" = YouTube search). quiz = {q, o:[options], a:correct index} */
var LESSONS={
"6|Maths":[
{title:"Whole Numbers",video:"",quiz:[
{q:"345 + 255 = ?",o:["500","600","590","610"],a:1},
{q:"12 x 5 = ?",o:["50","60","65","72"],a:1},
{q:"Which is the largest number?",o:["4,251","4,125","4,521","4,512"],a:2}]},
{title:"Fractions",video:"",quiz:[
{q:"1/2 + 1/4 = ?",o:["2/6","3/4","1/6","2/4"],a:1},
{q:"Which is bigger?",o:["2/3","3/4","They are equal","Cannot say"],a:1}]}],
/* Grade 6 Sinhala: one YouTube video ID per lesson, in order (Lesson 1, 2, 3...). "" = no link yet */
"6|Sinhala":["CjN0nR96Dys","BkOKdICK0PQ","RhjCn7dCOdI","WShaM6gvpYw","WO0aIIXzF2A","Ql0Xuit50zE","lwJIQZULPEk","Wqyfxt8qnTU","qHi_pUpOpAM","cW_dFjtSLSg","","RWzmEL1QT04"].map(function(id,i){return {title:"Lesson "+(i+1),video:id?"https://youtu.be/"+id:"",quiz:[]}}),
"6|Science":[
{title:"Living Things",video:"",quiz:[
{q:"Which of these is a living thing?",o:["Rock","Chair","Tree","Water"],a:2},
{q:"What do plants need to make food?",o:["Sunlight","Plastic","Sand","Smoke"],a:0}]}]
};
/* ===== APP ===== */
var SC={"Sinhala":"#F472B6","ICT":"#60A5FA","Science":"#34D399","English":"#A78BFA","Buddhism":"#FB923C","History":"#22D3EE","Maths":"#FBBF24"};
var GC=["#22D3EE","#A78BFA","#34D399","#FBBF24","#F472B6","#60A5FA"];
var TB_NAMES={"Sinhala":"Sinhala","ICT":"Information and Communication Technology ICT","Science":"Science","English":"English","Buddhism":"Buddhism","History":"History","Maths":"Mathematics"};
var S={grade:null,subject:null,lesson:null,mode:null};
var app=document.getElementById('app');
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ico(p){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'}
var IC={book:'<path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>',next:'<path d="M9 6l6 6-6 6"/>',quiz:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',video:'<polygon points="6 4 20 12 6 20 6 4"/>',note:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>'};
function key(){return S.grade+"|"+S.subject}
function textbookUrl(){return 'https://www.google.com/search?q='+encodeURIComponent('site:govdoc.lk Grade '+S.grade+' '+TB_NAMES[S.subject]+' Text Book')}
function lessons(){return LESSONS[key()]||[1,2,3,4,5].map(function(n){return {title:"Lesson "+n,video:"",quiz:[]}})}
function crumbs(){
var c=[['Grades',0]];
if(S.grade)c.push(['Grade '+S.grade,1]);
if(S.subject)c.push([S.subject,2]);
if(S.lesson!==null)c.push([lessons()[S.lesson].title,3]);
return '<nav class="crumbs" aria-label="Breadcrumb">'+c.map(function(x,i){return i===c.length-1?'<span class="cur">'+esc(x[0])+'</span>':'<button data-a="crumb" data-v="'+x[1]+'">'+esc(x[0])+'</button><i>/</i>'}).join('')+'</nav>';
}
function render(){
var h='';
if(!S.grade){
h+='<div class="hero"><span class="orb" style="width:180px;height:180px;right:-30px;top:-20px;background:#22D3EE"></span><span class="orb" style="width:120px;height:120px;right:160px;bottom:-30px;background:#A78BFA;animation-delay:-3s"></span><span class="tag">Grades 6 to 11</span><h1>Level up your <span class="cy">grades</span>.</h1><p>Video lessons, quizzes and textbooks for every subject, in one place.</p></div>';
h+='<div class="label">Choose your grade</div><div class="grid">';
GRADES.forEach(function(g,i){h+='<button class="tile" style="--c:'+GC[i]+'" data-a="grade" data-v="'+g+'"><small>Grade</small><b>'+g+'</b></button>'});
h+='</div><div class="label">Subjects</div><div class="chips">';
SUBJECTS.forEach(function(s){h+='<span class="chip">'+esc(s)+'</span>'});
h+='</div>';
}else if(!S.subject){
h+=crumbs()+'<h1 style="font-size:40px">Grade '+S.grade+'</h1><div class="label">Choose a subject</div><div class="grid">';
SUBJECTS.forEach(function(s){h+='<button class="tile sub" style="--c:'+SC[s]+'" data-a="subject" data-v="'+esc(s)+'"><span class="ic">'+esc(s.charAt(0))+'</span><span class="n">'+esc(s)+'</span></button>'});
h+='</div>';
}else if(S.lesson===null){
var tb=TEXTBOOKS[key()]||textbookUrl();
h+=crumbs()+'<h1 style="font-size:40px">Grade '+S.grade+' '+esc(S.subject)+'</h1>';
h+='<a class="btn pri" href="'+esc(tb)+'" target="_blank" rel="noopener">'+ico(IC.book)+'Text book</a>';
h+='<div class="label">Lessons</div><div class="list">';
lessons().forEach(function(l,i){h+='<button class="row" data-a="lesson" data-v="'+i+'"><span class="num">'+(i+1)+'</span>'+esc(l.title)+ico(IC.next)+'</button>'});
h+='</div>';
}else{
var l=lessons()[S.lesson];
h+=crumbs()+'<h1 style="font-size:36px">'+esc(l.title)+'</h1><div class="tabs">';
['quiz','video','note'].forEach(function(m){h+='<button class="btn'+(S.mode===m?' on':'')+'" data-a="mode" data-v="'+m+'">'+ico(IC[m])+m.charAt(0).toUpperCase()+m.slice(1)+'</button>'});
h+='</div>';
if(S.mode==='quiz'&&!l.quiz.length){
h+='<div class="card mute">Quiz questions will be added soon.</div>';
}else if(S.mode==='quiz'){
h+='<div class="card">';
l.quiz.forEach(function(q,i){h+='<div class="q"><strong>'+(i+1)+'. '+esc(q.q)+'</strong>';q.o.forEach(function(o,j){h+='<label><input type="radio" name="q'+i+'" value="'+j+'"> '+esc(o)+'</label>'});h+='</div>'});
h+='<button class="btn pri" data-a="check">Check answers</button><div id="result"></div></div>';
}else if(S.mode==='video'){
var url=l.video||'https://www.youtube.com/results?search_query='+encodeURIComponent('DP Education Grade '+S.grade+' '+S.subject+' '+l.title);
h+='<div class="card"><p style="margin:0" class="mute">The video opens on YouTube (DP Education).</p><a class="btn pri" href="'+esc(url)+'" target="_blank" rel="noopener">'+ico(IC.video)+'Play video</a></div>';
}else if(S.mode==='note'){
h+='<div class="card mute">Notes will be added soon.</div>';
}
}
app.innerHTML=h;
}
app.addEventListener('click',function(e){
var b=e.target.closest('[data-a]');if(!b)return;
var a=b.dataset.a,v=b.dataset.v;
if(a==='check'){
var L=lessons()[S.lesson].quiz,score=0;
L.forEach(function(q,i){
var labels=app.querySelectorAll('input[name="q'+i+'"]');
labels.forEach(function(inp){var lb=inp.parentNode;lb.classList.remove('ok','bad');
if(+inp.value===q.a)lb.classList.add('ok');
else if(inp.checked)lb.classList.add('bad');
if(inp.checked&&+inp.value===q.a)score++});
});
var r=document.getElementById('result');
r.className='';void r.offsetWidth;r.className='pop';
r.textContent='Score: '+score+' / '+L.length;
r.style.color=score===L.length?'var(--ok)':'var(--bad)';
return;
}
if(a==='grade'){S.grade=+v}
else if(a==='subject'){S.subject=v}
else if(a==='lesson'){S.lesson=+v;S.mode=null}
else if(a==='mode'){S.mode=v}
else if(a==='crumb'){var n=+v;if(n<1)S.grade=null;if(n<2)S.subject=null;if(n<3){S.lesson=null;S.mode=null}}
render();
window.scrollTo(0,0);
});
/* ===== SIGN IN (front-end only: saved in this browser) ===== */
var USER=null;
try{USER=JSON.parse(localStorage.getItem('lx_user')||'null')}catch(e){}
var authBtn=document.getElementById('auth'),modal=document.getElementById('modal');
function paintAuth(){authBtn.innerHTML=USER?'<span class="av">'+esc(USER.name.charAt(0).toUpperCase())+'</span>'+esc(USER.name.split(' ')[0]):'Sign in'}
function openModal(){
var x='<button class="x" data-m="close" aria-label="Close" type="button">&times;</button>';
modal.innerHTML=USER?
'<div class="dlg" role="dialog" aria-modal="true">'+x+'<h2 style="font-size:26px">Signed in</h2><p class="mute" style="margin:0">'+esc(USER.name)+'<br>'+esc(USER.email)+'</p><button class="btn" data-m="out" type="button">Sign out</button></div>':
'<div class="dlg" role="dialog" aria-modal="true">'+x+'<h2 style="font-size:26px">Sign in</h2><p class="mute" style="margin:0">Enter your details to continue.</p><label>Name<input id="lx_name" type="text" autocomplete="name"></label><label>Email<input id="lx_email" type="email" autocomplete="email"></label><div class="err" id="lx_err"></div><button class="btn pri" data-m="in" type="button" style="align-self:stretch">Sign in</button></div>';
modal.classList.add('show');
}
function closeModal(){modal.classList.remove('show')}
authBtn.addEventListener('click',openModal);
modal.addEventListener('click',function(e){
if(e.target===modal){closeModal();return}
var b=e.target.closest('[data-m]');if(!b)return;
var m=b.dataset.m;
if(m==='close')closeModal();
else if(m==='out'){USER=null;try{localStorage.removeItem('lx_user')}catch(e){}paintAuth();closeModal()}
else if(m==='in'){
var n=document.getElementById('lx_name').value.trim(),em=document.getElementById('lx_email').value.trim();
if(!n||!/^\S+@\S+\.\S+$/.test(em)){document.getElementById('lx_err').textContent='Please enter your name and a valid email.';return}
USER={name:n,email:em};try{localStorage.setItem('lx_user',JSON.stringify(USER))}catch(e){}
paintAuth();closeModal();
}
});
paintAuth();
render();
</script>
</body>
</html>
